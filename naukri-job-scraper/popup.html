<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naukri Job Scraper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="njs-popup">
    <main class="njs-popup-shell">
      <header class="njs-popup-header">
        <div>
          <h1>Naukri Job Scraper</h1>
          <p data-popup-message>Idle</p>
        </div>
        <span class="njs-popup-badge" data-popup-status>Idle</span>
      </header>

      <section class="njs-popup-stats" aria-label="Scrape progress">
        <div>
          <span>Jobs</span>
          <strong data-popup-count>0</strong>
        </div>
        <div>
          <span>Page</span>
          <strong data-popup-page>-</strong>
        </div>
        <div>
          <span>Tabs</span>
          <strong data-popup-tabs>0/6</strong>
        </div>
      </section>

      <section class="njs-popup-actions" aria-label="Scraper controls">
        <button type="button" data-popup-action="start">Start</button>
        <button type="button" data-popup-action="pause">Pause</button>
        <button type="button" data-popup-action="resume">Resume</button>
        <button type="button" data-popup-action="stop">Stop</button>
      </section>

      <section class="njs-popup-actions njs-popup-actions-secondary" aria-label="Data controls">
        <button type="button" data-popup-action="csv">Download CSV</button>
        <button type="button" data-popup-action="json">Download JSON</button>
        <button type="button" data-popup-action="clear-cache">Clear Cache</button>
      </section>

      <section>
        <div class="njs-popup-section-title">Last scraped jobs</div>
        <div class="njs-popup-preview" data-popup-preview>
          <div class="njs-popup-empty">No jobs scraped yet.</div>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
